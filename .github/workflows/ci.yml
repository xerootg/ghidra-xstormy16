name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  GHIDRA_TAG: Ghidra_12.1.2_build
  GHIDRA_ZIP: ghidra_12.1.2_PUBLIC_20260605.zip
  BINUTILS_VERSION: '2.45'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Ghidra
        id: ghidra
        uses: actions/cache@v6
        with:
          path: ~/ghidra-dist
          key: ghidra-${{ env.GHIDRA_ZIP }}

      - name: Fetch Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.ghidra.outputs.cache-hit }}" != true ]; then
            gh release download "$GHIDRA_TAG" -R NationalSecurityAgency/ghidra -p "$GHIDRA_ZIP" -D ~/ghidra-dist
          fi
          unzip -q ~/ghidra-dist/"$GHIDRA_ZIP" -d "$RUNNER_TEMP"
          echo "GHIDRA_INSTALL_DIR=$(ls -d "$RUNNER_TEMP"/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"

      - name: Cache xstormy16 binutils
        id: binutils
        uses: actions/cache@v6
        with:
          path: ~/xstormy16-binutils
          key: xstormy16-binutils-gas-ld-${{ env.BINUTILS_VERSION }}

      - name: Build xstormy16 binutils (reference disassembler, assembler and linker)
        if: steps.binutils.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL "https://ftp.gnu.org/gnu/binutils/binutils-$BINUTILS_VERSION.tar.xz" | tar xJ
          mkdir build && cd build
          "../binutils-$BINUTILS_VERSION/configure" --target=xstormy16-elf --prefix="$HOME/xstormy16-binutils" \
            --disable-nls --disable-werror --disable-gdb --disable-sim --disable-gprofng > /dev/null
          make -j"$(nproc)" all-binutils all-gas all-ld > /dev/null
          make install-binutils install-gas install-ld > /dev/null

      - name: Build extension
        run: ./gradlew --no-daemon buildExtension

      - name: Differential test against GNU objdump
        run: |
          mkdir -p "$HOME/.config/ghidra"
          # Install the built extension where headless Ghidra picks up user extensions.
          version=$(sed -n 's/^application.version=//p' "$GHIDRA_INSTALL_DIR/Ghidra/application.properties")
          dest="$HOME/.config/ghidra/ghidra_${version}_PUBLIC/Extensions"
          mkdir -p "$dest"
          unzip -q dist/*.zip -d "$dest"
          OBJDUMP="$HOME/xstormy16-binutils/bin/xstormy16-elf-objdump" test/run_diff.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ghidra-xstormy16
          path: dist/*.zip

  semantic-smoke:
    # Differential test of the SLEIGH semantics against two CGEN-generated reference
    # models (test/semantic). Confirmed findings whose fix is pending are expected to fail
    # and are tracked in adjudications.yaml.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Ghidra
        id: ghidra
        uses: actions/cache@v6
        with:
          path: ~/ghidra-dist
          key: ghidra-${{ env.GHIDRA_ZIP }}

      - name: Fetch Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.ghidra.outputs.cache-hit }}" != true ]; then
            gh release download "$GHIDRA_TAG" -R NationalSecurityAgency/ghidra -p "$GHIDRA_ZIP" -D ~/ghidra-dist
          fi
          unzip -q ~/ghidra-dist/"$GHIDRA_ZIP" -d "$RUNNER_TEMP"
          echo "GHIDRA_INSTALL_DIR=$(ls -d "$RUNNER_TEMP"/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: ghidra-xstormy16
          path: dist

      - name: Install guile and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq guile-3.0 python3-yaml > /dev/null

      - name: Cache oracle sources (SID snapshot, cgen, xstormy16.cpu)
        uses: actions/cache@v6
        with:
          path: ~/.cache/xs16-semval
          key: xs16-semval-${{ hashFiles('test/semantic/oracle/fetch-sid.sh', 'test/semantic/oracle/cgen26/regen.sh') }}

      - name: Regenerate the CGEN oracle and check it is unchanged
        run: |
          test/semantic/oracle/cgen26/regen.sh
          git diff --exit-code test/semantic/oracle/cgen26/gen

      - name: Semantic smoke run
        run: test/semantic/run-smoke.sh --threads "$(nproc)"

      - name: Job summary
        if: always()
        run: |
          if [ -f test/semantic/build/report/report.md ]; then
            cat test/semantic/build/report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-report
          path: |
            test/semantic/build/report/report.md
            test/semantic/build/report/buckets.json

  # Assembles test/decomp into a synthetic lens image and checks the decompiler's p-code
  # (amd64: the decompiler is native code). Reuses the binutils the build job cached.
  decomp-golden:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Ghidra
        id: ghidra
        uses: actions/cache@v6
        with:
          path: ~/ghidra-dist
          key: ghidra-${{ env.GHIDRA_ZIP }}

      - name: Fetch Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.ghidra.outputs.cache-hit }}" != true ]; then
            gh release download "$GHIDRA_TAG" -R NationalSecurityAgency/ghidra -p "$GHIDRA_ZIP" -D ~/ghidra-dist
          fi
          unzip -q ~/ghidra-dist/"$GHIDRA_ZIP" -d "$RUNNER_TEMP"
          echo "GHIDRA_INSTALL_DIR=$(ls -d "$RUNNER_TEMP"/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"

      - name: Restore xstormy16 binutils
        uses: actions/cache/restore@v6
        with:
          path: ~/xstormy16-binutils
          key: xstormy16-binutils-gas-ld-${{ env.BINUTILS_VERSION }}
          fail-on-cache-miss: true

      - name: Build and install extension
        run: |
          ./gradlew --no-daemon buildExtension
          version=$(sed -n 's/^application.version=//p' "$GHIDRA_INSTALL_DIR/Ghidra/application.properties")
          dest="$HOME/.config/ghidra/ghidra_${version}_PUBLIC/Extensions"
          mkdir -p "$dest"
          unzip -q dist/*.zip -d "$dest"

      - name: Decompiler golden checks
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          BINUTILS="$HOME/xstormy16-binutils/bin/xstormy16-elf-" test/decomp/run.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # Publishes only after every gate has passed on the tag.
  release:
    needs: [build, semantic-smoke, decomp-golden]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ghidra-xstormy16
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Re-running a tag build replaces the assets of the existing release.
        run: |
          version=${GHIDRA_TAG#Ghidra_}
          version=${version%_build}
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "Built against Ghidra $version."
          fi
